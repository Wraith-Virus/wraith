<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>WRAITH | SİSTEMƏ HÜCUM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root { --green: #00ff66; --red: #ff0033; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: var(--green); overflow: hidden; height: 100vh; }

        header { 
            display: flex; justify-content: space-between; padding: 15px 30px; 
            border-bottom: 1px solid var(--green); background: rgba(0,20,0,0.8);
        }
        #clock { font-size: 20px; color: var(--green); }

        /* Xəritə Sahəsi */
        .map-wrapper {
            position: relative; margin: 20px; flex-grow: 1;
            height: calc(100vh - 300px);
            border: 1px solid rgba(0, 255, 102, 0.2);
            background: url('map-az.png') no-repeat center;
            background-size: contain;
            overflow: hidden; 
            cursor: crosshair;
        }
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .node {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            transition: background 1s, box-shadow 1s; z-index: 5;
        }
        .node.green { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .node.red { background: var(--red); box-shadow: 0 0 10px var(--red); }

        /* Hədəf Halqası */
        #target-ring {
            position: absolute; width: 50px; height: 50px;
            border: 2px solid var(--red); border-radius: 50%;
            display: none; transform: translate(-50%, -50%);
            animation: pulse 1s infinite; pointer-events: none;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        /* Modallar */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid var(--green);
            padding: 30px; z-index: 100; text-align: center; display: none;
            box-shadow: 0 0 50px rgba(0, 255, 102, 0.3);
        }
        input { background: transparent; border: 1px solid var(--green); color: white; padding: 10px; margin: 10px 0; text-align: center; font-size: 22px; outline: none; }

        /* Alt Panel */
        .bottom-panel {
            height: 180px; border-top: 1px solid var(--green);
            display: flex; background: #050505;
        }
        .terminal { flex: 2; padding: 15px; font-size: 13px; overflow-y: auto; color: var(--green); border-right: 1px solid var(--green); }
        .controls { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; font-family: 'Share Tech Mono'; transition: 0.3s; }
        .btn-main { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }
        .btn-sign { background: var(--green); color: black; display: none; }
        .btn-main:disabled { background: #333; box-shadow: none; cursor: not-allowed; }

        @keyframes strobe { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
        .strobe-line { animation: strobe 0.15s infinite; }
    </style>
</head>
<body>

    <header>
        <div>[ SİSTEM: AKTİV ] [ MƏNBƏ: GLOBAL ]</div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="map-wrapper" id="map" onclick="handleMapClick(event)">
        <svg id="svg-layer"></svg>
        <div id="target-ring"></div>
    </div>

    <div class="bottom-panel">
        <div class="terminal" id="term-out">> Xəritədən hədəf nöqtəni seçin...</div>
        <div class="controls">
            <button id="main-btn" class="btn-main" onclick="startProcess()" disabled>SALDIRIYI BAŞLAT</button>
            <button id="sign-btn" class="btn-sign" onclick="drawSignature()">İMZA AT (🇦🇿)</button>
        </div>
    </div>

    <!-- Onay Kodu Modalı -->
    <div id="auth-modal" class="modal">
        <h3>TƏHLÜKƏSİZLİK TƏSDİQİ</h3>
        <p>ONAY KODUNU DAXİL EDİN:</p>
        <p style="color: var(--red); font-size: 30px; margin: 10px 0;" id="auth-timer">30</p>
        <input type="text" id="auth-input" placeholder="****" maxlength="4" autocomplete="off">
        <p id="attempts-label" style="margin-bottom: 15px;">Qalan haqq: 2</p>
        <button class="btn-main" onclick="checkCode()" style="background: var(--green); color: black; box-shadow: 0 0 10px var(--green);">TƏSDİQLƏ</button>
    </div>

    <!-- Hazırlanır Modalı -->
    <div id="prep-modal" class="modal">
        <h2 style="letter-spacing: 5px; margin-bottom: 15px;">SALDIRI HAZIRLANIR...</h2>
        <div style="font-size: 20px;">[||||||||||||||] 100%</div>
    </div>

    <!-- Final Attack Modalı -->
    <div id="final-modal" class="modal">
        <h1 style="color: var(--red); font-size: 60px; margin-bottom: 20px;">ATTACK?</h1>
        <button class="btn-main" onclick="executeFinalAttack()">HƏ, BAŞLAT!</button>
    </div>

    <script>
        let selectedX, selectedY;
        let attempts = 2;
        let timerInterval;
        let attackActive = false;
        const correctCode = "2268"; // Təsdiq kodu yeniləndi

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

        const map = document.getElementById('map');
        const nodes = [];
        for(let i=0; i<45; i++) {
            const n = document.createElement('div');
            n.className = 'node green';
            const x = Math.random() * 92 + 4;
            const y = Math.random() * 88 + 4;
            n.style.left = x + "%";
            n.style.top = y + "%";
            map.appendChild(n);
            nodes.push({el: n, x, y});
        }

        function handleMapClick(e) {
            if(attackActive) return;
            const rect = map.getBoundingClientRect();
            selectedX = ((e.clientX - rect.left) / rect.width) * 100;
            selectedY = ((e.clientY - rect.top) / rect.height) * 100;

            const ring = document.getElementById('target-ring');
            ring.style.display = 'block';
            ring.style.left = selectedX + "%";
            ring.style.top = selectedY + "%";

            document.getElementById('main-btn').disabled = false;
            addLog(`Koordinat kilidləndi: ${selectedX.toFixed(1)} / ${selectedY.toFixed(1)}`);
        }

        function startProcess() {
            if(attackActive) { stopAttack(); return; }
            document.getElementById('auth-modal').style.display = 'block';
            let timeLeft = 30;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('auth-timer').innerText = timeLeft;
                if(timeLeft <= 0) window.location.href = "index.html";
            }, 1000);
        }

        function checkCode() {
            const val = document.getElementById('auth-input').value;
            if(val === correctCode) {
                clearInterval(timerInterval);
                document.getElementById('auth-modal').style.display = 'none';
                showPreparation();
            } else {
                attempts--;
                if(attempts < 0) window.location.href = "index.html";
                document.getElementById('attempts-label').innerText = `Qalan haqq: ${attempts + 1}`;
                document.getElementById('auth-input').value = "";
                addLog("XƏTA: Yanlış onay kodu!", "#ff0033");
            }
        }

        function showPreparation() {
            document.getElementById('prep-modal').style.display = 'block';
            setTimeout(() => {
                document.getElementById('prep-modal').style.display = 'none';
                nodes.forEach(n => {
                    n.el.classList.remove('green');
                    n.el.classList.add('red');
                });
                document.getElementById('final-modal').style.display = 'block';
            }, 2500);
        }

        function executeFinalAttack() {
            document.getElementById('final-modal').style.display = 'none';
            attackActive = true;
            document.getElementById('main-btn').innerText = "SALDIRIYI DURDUR";
            document.getElementById('sign-btn').style.display = 'block';
            
            const svg = document.getElementById('svg-layer');
            nodes.forEach((n, i) => {
                setTimeout(() => {
                    if(!attackActive) return;
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", n.x + "%");
                    line.setAttribute("y1", n.y + "%");
                    line.setAttribute("x2", selectedX + "%");
                    line.setAttribute("y2", selectedY + "%");
                    line.setAttribute("stroke", "#ff0033");
                    line.setAttribute("stroke-width", "1.2");
                    line.classList.add('strobe-line');
                    svg.appendChild(line);
                }, i * 40);
            });
            addLog("HÜCUM DALĞASI AKTİVDİR: Paketlər göndərilir...", "#ff0033");
        }

        function stopAttack() {
            attackActive = false;
            document.getElementById('svg-layer').innerHTML = "";
            document.getElementById('main-btn').innerText = "SALDIRIYI BAŞLAT";
            document.getElementById('main-btn').disabled = true;
            document.getElementById('target-ring').style.display = 'none';
            document.getElementById('sign-btn').style.display = 'none';
            addLog("Sistem soyudulur. Əməliyyat dayandırıldı.");
            nodes.forEach(n => {
                n.el.classList.remove('red');
                n.el.classList.add('green');
            });
        }

        function drawSignature() {
            const svg = document.getElementById('svg-layer');
            svg.innerHTML = "";
            addLog("İMZA PROSESİ: 🇦🇿 AY-ULDUZ FORMALASDIRILIR...", "#00ff66");
            
            // Xətlərlə Ay-Ulduz effekti
            const signatureHTML = `
                <circle cx="50%" cy="45%" r="50" stroke="#00ff66" fill="none" stroke-width="2" stroke-dasharray="10,5" />
                <circle cx="53%" cy="45%" r="45" stroke="black" fill="black" />
                <path d="M 55% 40% L 57% 45% L 62% 45% L 58% 48% L 59% 53% L 55% 50% L 51% 53% L 52% 48% L 48% 45% L 53% 45% Z" fill="#00ff66" class="strobe-line" />
            `;
            svg.innerHTML = signatureHTML;
        }

        function addLog(msg, color = "#00ff66") {
            const out = document.getElementById('term-out');
            out.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
            out.scrollTop = out.scrollHeight;
        }
    </script>
</body>
</html>
