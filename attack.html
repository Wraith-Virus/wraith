<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>WRAITH | PROFESİONAL HÜCUM PANELİ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root { --green: #00ff66; --red: #ff0033; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: var(--green); overflow: hidden; height: 100vh; }

        header { 
            display: flex; justify-content: space-between; padding: 10px 30px; 
            border-bottom: 1px solid var(--green); background: rgba(0,20,0,0.8);
            z-index: 10; position: relative;
        }

        /* Xəritə Sahəsi - Nöqtələrin məhdudlaşdırıldığı zonadır */
        .map-wrapper {
            position: relative; 
            width: 80%; height: 60vh;
            margin: 40px auto;
            border: 1px solid rgba(0, 255, 102, 0.3);
            background: url('map-az.png') no-repeat center;
            background-size: contain;
            overflow: hidden; 
            cursor: crosshair;
            box-shadow: inset 0 0 50px #000;
        }
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* Nöqtə Stili */
        .node {
            position: absolute; width: 5px; height: 5px; border-radius: 50%;
            transition: background 1s, box-shadow 1s, opacity 0.5s; z-index: 6;
        }
        .node.green { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .node.red { background: var(--red); box-shadow: 0 0 10px var(--red); }

        /* Xətlərin Yumşaq Yanıb-Sönməsi (Fade Effect) */
        @keyframes softPulse {
            0%, 100% { opacity: 0.2; stroke-width: 1; }
            50% { opacity: 1; stroke-width: 1.5; }
        }
        .attack-line { animation: softPulse 3s ease-in-out infinite; }

        /* Hədəf Halqası */
        #target-ring {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid var(--red); border-radius: 50%;
            display: none; transform: translate(-50%, -50%);
            animation: ringPulse 1s infinite; pointer-events: none; z-index: 7;
        }
        @keyframes ringPulse { 0% { scale: 0.8; opacity: 1; } 100% { scale: 1.8; opacity: 0; } }

        /* Modallar */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.98); border: 1px solid var(--green);
            padding: 30px; z-index: 1000; text-align: center; display: none;
            min-width: 350px; box-shadow: 0 0 100px rgba(0, 255, 102, 0.2);
        }
        input { background: transparent; border: 1px solid var(--green); color: white; padding: 10px; margin: 15px 0; text-align: center; font-size: 24px; outline: none; width: 150px; }

        /* Alt Panel */
        .bottom-panel {
            position: fixed; bottom: 0; width: 100%; height: 160px; 
            border-top: 1px solid var(--green); display: flex; background: #020202;
        }
        .terminal { flex: 2; padding: 15px; font-size: 13px; overflow-y: auto; color: var(--green); border-right: 1px solid var(--green); }
        .controls { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; border: none; transition: 0.3s; }
        .btn-main { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }
        .btn-sign { background: var(--green); color: black; font-weight: bold; }
        button:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        /* İmza Animasiyası */
        #signature-layer { transition: opacity 2s; }
    </style>
</head>
<body>

    <header>
        <div>[ SİSTEM: AKTİV ] [ HUB: GLOBAL_NODE ]</div>
        <div id="clock">00:00:00</div>
    </header>

    <div class="map-wrapper" id="map" onclick="handleMapClick(event)">
        <svg id="svg-layer"></svg>
        <div id="target-ring"></div>
    </div>

    <div class="bottom-panel">
        <div class="terminal" id="term-out">> Sistem hazır. Xəritədə hədəfi işarələyin...</div>
        <div class="controls">
            <button id="main-btn" class="btn-main" onclick="startProcess()" disabled>SALDIRIYI BAŞLAT</button>
            <button id="sign-btn" class="btn-sign" onclick="handleSignature()" style="display:none;">İMZA AT (🇦🇿)</button>
        </div>
    </div>

    <!-- Modallar eynilə qalır (Kod: 2268) -->
    <div id="auth-modal" class="modal">
        <h3>TƏHLÜKƏSİZLİK KODU</h3>
        <p style="color: var(--red); font-size: 25px; margin: 10px 0;" id="auth-timer">30</p>
        <input type="text" id="auth-input" placeholder="****" maxlength="4" autocomplete="off">
        <p id="attempts-label">Qalan haqq: 2</p>
        <button onclick="checkCode()" style="background:var(--green); color:black; padding:10px 20px; margin-top:10px;">TƏSDİQLƏ</button>
    </div>

    <div id="prep-modal" class="modal">
        <h2>SİNYAL GÜCLƏNDİRİLİR...</h2>
        <div style="margin-top:20px; font-size:14px;">[####################] 100%</div>
    </div>

    <div id="final-modal" class="modal">
        <h1 style="color: var(--red); font-size: 45px; margin-bottom: 20px;">HÜCUMU TƏSDİQLƏ?</h1>
        <button class="btn-main" onclick="executeFinalAttack()">İCRA ET</button>
    </div>

    <script>
        let selectedX, selectedY;
        let attempts = 2;
        let timerInterval;
        let attackActive = false;
        const correctCode = "2268";

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

        // Nöqtələrin yaradılması - Yalnız xəritə panelinin içində
        const map = document.getElementById('map');
        const nodes = [];
        for(let i=0; i<40; i++) {
            const n = document.createElement('div');
            n.className = 'node green';
            // Koordinatları 15% - 85% aralığına sıxdım ki, kənarlara toxunmasın
            const x = Math.random() * 70 + 15;
            const y = Math.random() * 60 + 20;
            n.style.left = x + "%";
            n.style.top = y + "%";
            map.appendChild(n);
            nodes.push({el: n, x, y});
        }

        function handleMapClick(e) {
            if(attackActive) return;
            const rect = map.getBoundingClientRect();
            selectedX = ((e.clientX - rect.left) / rect.width) * 100;
            selectedY = ((e.clientY - rect.top) / rect.height) * 100;

            const ring = document.getElementById('target-ring');
            ring.style.display = 'block';
            ring.style.left = selectedX + "%";
            ring.style.top = selectedY + "%";

            document.getElementById('main-btn').disabled = false;
            addLog(`Hədəf koordinatı: ${selectedX.toFixed(1)} / ${selectedY.toFixed(1)}`);
        }

        function startProcess() {
            if(attackActive) { stopAttack(); return; }
            document.getElementById('auth-modal').style.display = 'block';
            let timeLeft = 30;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('auth-timer').innerText = timeLeft;
                if(timeLeft <= 0) window.location.href = "index.html";
            }, 1000);
        }

        function checkCode() {
            const val = document.getElementById('auth-input').value;
            if(val === correctCode) {
                clearInterval(timerInterval);
                document.getElementById('auth-modal').style.display = 'none';
                showPreparation();
            } else {
                attempts--;
                if(attempts < 0) window.location.href = "index.html";
                document.getElementById('attempts-label').innerText = `Qalan haqq: ${attempts + 1}`;
                document.getElementById('auth-input').value = "";
            }
        }

        function showPreparation() {
            document.getElementById('prep-modal').style.display = 'block';
            setTimeout(() => {
                document.getElementById('prep-modal').style.display = 'none';
                nodes.forEach(n => { n.el.classList.remove('green'); n.el.classList.add('red'); });
                document.getElementById('final-modal').style.display = 'block';
            }, 2000);
        }

        function executeFinalAttack() {
            document.getElementById('final-modal').style.display = 'none';
            attackActive = true;
            document.getElementById('main-btn').innerText = "HÜCUMU DAYANDIR";
            document.getElementById('sign-btn').style.display = 'block';
            
            const svg = document.getElementById('svg-layer');
            svg.innerHTML = ""; // Təmizlə

            nodes.forEach((n, i) => {
                setTimeout(() => {
                    if(!attackActive) return;
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", n.x + "%");
                    line.setAttribute("y1", n.y + "%");
                    line.setAttribute("x2", selectedX + "%");
                    line.setAttribute("y2", selectedY + "%");
                    line.setAttribute("stroke", "#ff0033");
                    line.setAttribute("class", "attack-line"); // Yumşaq yanıb-sönmə
                    svg.appendChild(line);
                }, i * 50);
            });
            addLog("HÜCUM AKTİVDİR: Paketlər ötürülür...", "#ff0033");
        }

        function stopAttack() {
            attackActive = false;
            document.getElementById('svg-layer').innerHTML = "";
            document.getElementById('main-btn').innerText = "SALDIRIYI BAŞLAT";
            document.getElementById('main-btn').disabled = true;
            document.getElementById('sign-btn').style.display = 'none';
            document.getElementById('target-ring').style.display = 'none';
            addLog("Əməliyyat dayandırıldı.");
            nodes.forEach(n => { n.el.classList.remove('red'); n.el.classList.add('green'); });
        }

        // 🇦🇿 İmza Funksiyası
        function handleSignature() {
            // Hücumu dayandır
            attackActive = false;
            const svg = document.getElementById('svg-layer');
            svg.innerHTML = ""; 
            addLog("HÜCUM DAYANDIRILDI. İMZA ATILIR...", "#00ff66");

            // Ay-Ulduz çəkilməsi
            const signatureHTML = `
                <g id="signature-layer">
                    <path d="M 45% 40% A 30 30 0 1 0 45% 60% A 25 25 0 1 1 45% 40%" fill="none" stroke="#00ff66" stroke-width="2" />
                    <path d="M 55% 45% L 57% 50% L 62% 50% L 58% 53% L 59% 58% L 55% 55% L 51% 58% L 52% 53% L 48% 50% L 53% 50% Z" fill="#00ff66" />
                </g>
            `;
            svg.innerHTML = signatureHTML;

            // 15 saniyə sonra yavaş-yavaş bitsin
            setTimeout(() => {
                const sig = document.getElementById('signature-layer');
                if(sig) sig.style.opacity = "0";
                setTimeout(() => {
                    stopAttack();
                    addLog("İmza prosesi başa çatdı.");
                }, 2000);
            }, 15000);
        }

        function addLog(msg, color = "#00ff66") {
            const out = document.getElementById('term-out');
            out.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
            out.scrollTop = out.scrollHeight;
        }
    </script>
</body>
</html>
