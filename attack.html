<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>WRAITH | NEON MAP SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root { --green: #00ff66; --red: #ff0033; --blue: #00aaff; --white: #ffffff; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: var(--green); overflow: hidden; height: 100vh; }

        /* XƏRİTƏ FONU BURADADIR */
        .map-wrapper {
            position: relative; width: 95%; height: 75vh; margin: 10px auto;
            border: 1px solid rgba(0, 255, 102, 0.2);
            overflow: hidden;
            /* Əgər faylın varsa 'map.png' yaz, yoxdursa bu kiber-tor fonu işləyəcək */
            background: radial-gradient(circle at center, rgba(0,255,102,0.05) 0%, transparent 70%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 2px, 3px 100%;
            box-shadow: inset 0 0 50px #000;
        }

        /* Nöqtələr */
        .node {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 6; opacity: 0;
        }
        .neon-green { background: var(--green); box-shadow: 0 0 8px var(--green); opacity: 1; animation: slowBlink 3s infinite; }
        .neon-red { background: var(--red); box-shadow: 0 0 8px var(--red); opacity: 1; }
        .neon-blue { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
        .neon-white { background: var(--white); box-shadow: 0 0 10px var(--white); }

        @keyframes slowBlink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Hədəf Halqası */
        #target-ring {
            position: absolute; width: 60px; height: 60px; border: 2px solid var(--red);
            border-radius: 50%; box-shadow: 0 0 15px var(--red); display: none;
            transform: translate(-50%, -50%); z-index: 10; animation: targetPulse 1s infinite;
        }
        @keyframes targetPulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }

        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .attack-line { stroke: var(--red); stroke-width: 1; opacity: 0; }
        @keyframes chaosLine { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.6; } }

        /* Panellər */
        .bottom-panel { position: fixed; bottom: 0; width: 100%; height: 130px; border-top: 1px solid var(--green); display: flex; background: #000; }
        .terminal { flex: 2; padding: 15px; font-size: 12px; overflow-y: auto; color: var(--green); border-right: 1px solid var(--green); }
        .controls { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        
        button { padding: 10px 20px; cursor: pointer; border: 1px solid var(--green); background: transparent; color: var(--green); font-family: 'Share Tech Mono'; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--green); color: #000; box-shadow: 0 0 15px var(--green); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 2000; justify-content: center; align-items: center; color: var(--red); font-size: 50px; }
    </style>
</head>
<body>

    <div class="map-wrapper" id="map" onclick="handleMapClick(event)">
        <svg id="svg-layer"></svg>
        <div id="target-ring"></div>
    </div>

    <div class="bottom-panel">
        <div class="terminal" id="term-out">> SİSTEM HAZIRDIR. HƏDƏF GÖZLƏNİLİR...</div>
        <div class="controls" id="ctrl-box">
            <button onclick="enableSelection()">HƏDƏF SEÇ</button>
        </div>
    </div>

    <div id="shutdown-screen" class="overlay">
        <div id="count-num">3</div>
    </div>

    <script>
        let nodes = [];
        let isSelecting = false;
        let targetPos = { x: 0, y: 0 };
        const map = document.getElementById('map');
        const svg = document.getElementById('svg-layer');

        // Başlanğıc nöqtələr
        function createNodes(count, type) {
            for(let i=0; i<count; i++) {
                const n = document.createElement('div');
                n.className = `node ${type}`;
                n.style.left = Math.random() * 100 + "%";
                n.style.top = Math.random() * 100 + "%";
                map.appendChild(n);
                nodes.push(n);
            }
        }
        createNodes(60, 'neon-green');

        function enableSelection() {
            isSelecting = true;
            map.style.cursor = "crosshair";
            addLog("Hədəf seçimi aktivdir...");
        }

        function handleMapClick(e) {
            if(!isSelecting) return;
            const rect = map.getBoundingClientRect();
            targetPos.x = ((e.clientX - rect.left) / rect.width) * 100;
            targetPos.y = ((e.clientY - rect.top) / rect.height) * 100;
            
            const ring = document.getElementById('target-ring');
            ring.style.display = "block";
            ring.style.left = targetPos.x + "%";
            ring.style.top = targetPos.y + "%";
            
            isSelecting = false;
            map.style.cursor = "default";
            document.getElementById('ctrl-box').innerHTML = `<button onclick="prepareAttack()">HAZIRLA</button>`;
            addLog("Hədəf kilidləndi.");
        }

        async function prepareAttack() {
            addLog("Nöqtələr transformasiya olunur...");
            nodes.forEach((n, i) => {
                setTimeout(() => n.className = 'node neon-red', i * 30);
            });
            await new Promise(r => setTimeout(r, 2000));
            document.getElementById('ctrl-box').innerHTML = `<button style="color:var(--red); border-color:var(--red);" onclick="startAttack()">ATACK</button>`;
        }

        function startAttack() {
            addLog("HÜCUM BAŞLADI!");
            document.getElementById('ctrl-box').innerHTML = `
                <button onclick="startSignature()">İMZA AT</button>
                <button onclick="shutdown()">SONLANDIR</button>
            `;
            nodes.forEach(n => {
                const angle = Math.random() * Math.PI * 2;
                const dist = 6 + Math.random() * 6;
                const tx = targetPos.x + Math.cos(angle) * dist;
                const ty = targetPos.y + Math.sin(angle) * dist;
                n.style.left = tx + "%"; n.style.top = ty + "%";
                
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", tx + "%"); line.setAttribute("y1", ty + "%");
                line.setAttribute("x2", targetPos.x + "%"); line.setAttribute("y2", targetPos.y + "%");
                line.setAttribute("class", "attack-line");
                line.style.animation = `chaosLine ${0.4 + Math.random()}s infinite`;
                svg.appendChild(line);
            });
        }

        function shutdown() {
            const screen = document.getElementById('shutdown-screen');
            screen.style.display = "flex";
            let c = 3;
            const timer = setInterval(() => {
                c--;
                document.getElementById('count-num').innerText = c;
                if(c <= 0) { clearInterval(timer); location.reload(); }
            }, 1000);
        }

        async function startSignature() {
            addLog("İmza prosesi başladıldı...");
            svg.innerHTML = "";
            document.getElementById('target-ring').style.display = "none";
            nodes.forEach(n => n.style.opacity = "0");

            // Yeni 2500 nöqtənin yavaş-yavaş gəlməsi
            for(let i=0; i<2500; i++) {
                const n = document.createElement('div');
                n.className = 'node neon-white';
                n.style.left = Math.random() * 100 + "%";
                n.style.top = Math.random() * 100 + "%";
                map.appendChild(n);
                nodes.push(n);
                // Nöqtələr duman kimi yavaşca peydə olsun
                setTimeout(() => {
                    n.style.opacity = "1";
                    const row = Math.floor(i / 50);
                    const col = i % 50;
                    n.style.left = (25 + col * 1) + "%";
                    n.style.top = (25 + row * 1) + "%";
                }, i * 1.5);
            }

            await new Promise(r => setTimeout(r, 6000));
            nodes.forEach(n => { n.style.transition = "all 0.4s"; n.className = 'node neon-red'; });
            
            await new Promise(r => setTimeout(r, 1000));
            addLog("BAYRAQ FORMALANIR...");

            // Dəqiq Bayraq Hesablaması
            nodes.forEach((n, i) => {
                const row = Math.floor(i / 50);
                const col = i % 50;
                const x = 25 + col * 1;
                const y = 25 + row * 1;
                n.style.transition = "all 2s ease-in-out";

                if (row < 16) n.className = 'node neon-blue';
                else if (row < 33) n.className = 'node neon-red';
                else n.className = 'node neon-green';

                // Ay-Ulduz
                const dx = x - 47.5, dy = y - 41.5;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const dx2 = x - 49.2;
                const dist2 = Math.sqrt(dx2*dx2 + dy*dy);
                
                const isMoon = (dist < 5.2 && dist > 4.0 && x < 50 && dist2 > 4.0);
                
                const ux = x - 53.5, uy = y - 41.5;
                const uDist = Math.sqrt(ux*ux + uy*uy);
                const angle = Math.atan2(uy, ux);
                const star = uDist < (1.6 + Math.abs(Math.cos(angle * 4)) * 1.2);

                if ((row >= 16 && row < 33) && (isMoon || star)) {
                    n.className = 'node neon-white';
                }
            });
        }

        function addLog(msg) {
            const out = document.getElementById('term-out');
            out.innerHTML += `<div>> ${msg}</div>`;
            out.scrollTop = out.scrollHeight;
        }
    </script>
</body>
</html>
