<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>WRAITH SYSTEM | HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            background-color: #000;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 50px;
        }
        .logo-container img {
            width: 150px; /* Loqonun ölçüsü */
            filter: drop-shadow(0 0 15px #00ff66);
        }
        .logo-container h1 {
            font-size: 3rem;
            letter-spacing: 15px;
            margin-top: 20px;
            text-shadow: 0 0 20px #00ff66;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(2, 250px);
            gap: 20px;
        }
        .menu-item {
            border: 1px solid #00ff66;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #00ff66;
            transition: 0.3s;
            background: rgba(0, 255, 102, 0.05);
            font-size: 1.1rem;
        }
        .menu-item:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 30px #00ff66;
            transform: scale(1.05);
        }
        .menu-item i { margin-right: 10px; }
        .attack-btn { grid-column: span 2; border-color: #ff0033; color: #ff0033; }
        .attack-btn:hover { background: #ff0033; color: #fff; box-shadow: 0 0 30px #ff0033; }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Bura öz loqonun adını yaz: logo.png -->
        <img src="logo.png" alt="WRAITH LOGO"> 
        <h1>WRAITH SYSTEM</h1>
    </div>

    <div class="menu">
        <a href="attack.html" class="menu-item attack-btn">
            <i class="fas fa-radiation"></i> SİSTEMƏ HÜCUM (ATTACK)
        </a>
        <a href="#" class="menu-item">
            <i class="fab fa-instagram"></i> Instagram Sızma
        </a>
        <a href="#" class="menu-item">
            <i class="fas fa-user-slash"></i> Instagram Hesab Uçurtma
        </a>
        <a href="#" class="menu-item">
            <i class="fab fa-tiktok"></i> TikTok Giriş
        </a>
        <a href="#" class="menu-item">
            <i class="fas fa-shield-alt"></i> Proxy/VPN Status
        </a>
    </div>

</body>
</html>
