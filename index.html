<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>WRAITH | SİSTEM_HACK_v2.7.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --neon-green: #00ff66;
            --bg-dark: #000a05;
            --panel-bg: rgba(0, 20, 10, 0.7);
            --red-alert: #ff0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }

        body {
            background-color: #000;
            color: var(--neon-green);
            overflow: hidden;
            background-image: radial-gradient(circle, #05150a 0%, #000 100%);
        }

        /* ----- GİRİŞ EKRANI ----- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: 1s;
        }
        #boot-screen input {
            background: transparent; border: none; border-bottom: 2px solid var(--neon-green);
            color: var(--neon-green); font-size: 24px; text-align: center; outline: none;
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* ----- ƏSAS PANEL ----- */
        #main-ui { display: none; padding: 10px; height: 100vh; grid-template-rows: 50px 1fr 40px; display: none; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-green); padding: 0 20px;
        }

        .lang-btn { cursor: pointer; border: 1px solid var(--neon-green); padding: 2px 5px; font-size: 12px; }

        /* GRID LAYOUT */
        .dashboard {
            display: grid; grid-template-columns: 2fr 1fr; gap: 10px; padding: 10px; height: 85vh;
        }

        .panel {
            border: 1px solid rgba(0, 255, 102, 0.3); background: var(--panel-bg);
            padding: 10px; position: relative; overflow: hidden;
        }

        /* MAP AREA */
        #map-area {
            background: url('map.png') center/contain no-repeat;
            position: relative;
        }

        .red-dot {
            position: absolute; width: 4px; height: 4px; background: var(--red-alert);
            border-radius: 50%; box-shadow: 0 0 8px var(--red-alert);
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ATTACK ANIMATION AREA */
        #attack-target {
            position: absolute; border: 2px solid var(--red-alert);
            border-radius: 50%; width: 40px; height: 40px;
            top: 42%; left: 63%; /* Ermənistan təxmini koordinat */
            display: none; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--red-alert);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        /* CLOCK & LABELS */
        .vaxt-box { position: absolute; top: 10px; right: 20px; font-size: 18px; color: var(--neon-green); }

        /* TERMINAL */
        #terminal { font-size: 12px; line-height: 1.4; overflow-y: auto; height: 300px; }

        /* BUTTONS */
        .btn-attack {
            background: var(--red-alert); color: #fff; border: none;
            padding: 10px 20px; cursor: pointer; font-weight: bold;
            margin-top: 20px; box-shadow: 0 0 10px var(--red-alert);
        }

        /* MODAL */
        #modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 2px solid var(--neon-green);
            padding: 30px; display: none; z-index: 2000; text-align: center;
        }

        /* BOTTOM BAR */
        .bottom-bar {
            display: flex; justify-content: center; align-items: center;
            border-top: 1px solid var(--neon-green); color: var(--neon-green);
        }

        #timer { font-size: 32px; margin-left: 20px; text-shadow: 0 0 10px var(--neon-green); }
    </style>
</head>
<body>

    <div id="boot-screen">
        <input type="password" id="pass" placeholder="KODU DAXİL EDİN..." autocomplete="off">
    </div>

    <div id="main-ui">
        <header>
            <div style="letter-spacing: 5px; font-weight: bold;">WRAITH</div>
            <div>[SİSTEM] [ŞƏBƏKƏ] [MODULLAR] [GİZLİ KASSA]</div>
            <div class="lang-btn" onclick="location.href='index.en.html'">🇦🇿 AZ ▼</div>
        </header>

        <div class="dashboard">
            <div class="panel" id="map-area">
                <div style="font-size: 12px;">[QLOBAL YOLUXMA XƏRİTƏSİ]</div>
                <div class="vaxt-box">VAXT: <span id="live-clock">00:00:00</span></div>
                
                <div id="attack-target"></div>
                <div id="dots-container"></div>
            </div>

            <div class="panel">
                <div style="border-bottom: 1px solid var(--neon-green); padding-bottom: 5px;">TERMINAL - CANLI ƏMƏLİYYATLAR</div>
                <div id="terminal"></div>
                <div style="margin-top: 20px;">
                    <p>AKTİV YOLUXMALAR: 1,452,109</p>
                    <p>ÜMUMİ SIZMALAR: 12.3K</p>
                    <button class="btn-attack" onclick="openAttack()">HÜCUMA BAŞLA (ATTACK)</button>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            ŞƏBƏKƏYƏ SIZMA ÜÇÜN QALAN VAXT: <span id="timer">00:00:00</span>
        </div>
    </div>

    <!-- Attack Modal -->
    <div id="modal">
        <div id="modal-content">
            <p>HƏDƏF ÖLKƏNİ YAZIN:</p>
            <input type="text" id="target-country" style="background:transparent; border:1px solid var(--neon-green); color:white; margin:10px;"><br>
            <button onclick="confirmCountry()" style="background:var(--neon-green); border:none; padding:5px 10px; cursor:pointer;">TƏSDİQLƏ</button>
        </div>
    </div>

    <script>
        // 1. Giriş
        const passInput = document.getElementById('pass');
        passInput.addEventListener('keyup', (e) => {
            if(passInput.value.toLowerCase() === 'wraith') {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'grid';
                startTerminal();
                generateDots();
            }
        });

        // 2. Canlı Saat (Azərbaycan vaxtı)
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('az-AZ');
        }, 1000);

        // 3. Xəritədə Qırmızı Nöqtələr
        function generateDots() {
            const container = document.getElementById('dots-container');
            for(let i=0; i<15; i++) {
                const dot = document.createElement('div');
                dot.className = 'red-dot';
                dot.style.top = Math.random() * 80 + 10 + '%';
                dot.style.left = Math.random() * 80 + 10 + '%';
                container.appendChild(dot);
            }
        }

        // 4. Hücum Sistemi
        function openAttack() {
            document.getElementById('modal').style.display = 'block';
        }

        function confirmCountry() {
            const country = document.getElementById('target-country').value;
            if(country) {
                document.getElementById('modal-content').innerHTML = `
                    <p>TƏHLÜKƏSİZLİK KODUNU DAXİL EDİN:</p>
                    <input type="text" id="auth-code" style="background:transparent; border:1px solid var(--neon-green); color:white; margin:10px;"><br>
                    <button onclick="finalAttack()" style="background:var(--red-alert); border:none; padding:5px 10px; color:white; cursor:pointer;">HÜCUMU TƏSDİQLƏ</button>
                `;
            }
        }

        function finalAttack() {
            const code = document.getElementById('auth-code').value;
            if(code === '2268') {
                document.getElementById('modal').style.display = 'none';
                document.getElementById('attack-target').style.display = 'block';
                startCountdown();
                addTerminalLog("[KRİTİK] Hücum başladıldı: Hədəf Ermənistan...");
                addTerminalLog("[SİSTEM] Serverlər yüklənir...");
            } else {
                alert("YALNIŞ KOD!");
            }
        }

        // 5. Geri Sayım (5 dəqiqə)
        function startCountdown() {
            let time = 300; 
            const timerDisplay = document.getElementById('timer');
            const interval = setInterval(() => {
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let s = (time % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `00:${m}:${s}`;
                if(time === 0) clearInterval(interval);
                time--;
            }, 1000);
        }

        function addTerminalLog(msg) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<p style="color:var(--neon-green)">${msg}</p>`;
            term.scrollTop = term.scrollHeight;
        }

        function startTerminal() {
            setInterval(() => {
                const logs = ["[BAĞLANTI SABİTDİR]", "[MƏLUMAT AXINI: 124kb/s]", "[PROXY AKTİVDİR]", "[SIZMA DAVAM EDİR]"];
                addTerminalLog(logs[Math.floor(Math.random()*logs.length)]);
            }, 3000);
        }
    </script>
</body>
</html>
