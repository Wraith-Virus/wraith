<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRAITH | SİSTEM_HACK_v3.5</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root { --neon-green: #00ff66; --alert-red: #ff0033; --bg-obsidian: #020503; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background-color: #000; color: var(--neon-green); overflow: hidden; height: 100vh; }

        /* AUTH POPUP */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .auth-card {
            background: var(--bg-obsidian); border: 1px solid var(--neon-green);
            padding: 40px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
        }
        #pass-input {
            background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px; font-size: 20px; text-align: center; outline: none;
        }

        /* MAIN UI */
        #main-dashboard { display: none; height: 100vh; flex-direction: column; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 30px; border-bottom: 1px solid var(--neon-green);
            background: rgba(0,0,0,0.9);
        }
        .lang-select { cursor: pointer; border: 1px solid var(--neon-green); padding: 5px 10px; position: relative; }
        .lang-dropdown { display: none; position: absolute; top: 100%; right: 0; background: #000; border: 1px solid var(--neon-green); width: 100px; }
        .lang-select:hover .lang-dropdown { display: block; }
        .lang-dropdown a { display: block; padding: 10px; color: var(--neon-green); text-decoration: none; }

        /* MAP AREA - Xəritə burada mütləq görünəcək */
        .map-frame {
            position: relative; flex-grow: 1; margin: 15px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            background-image: url('map-az.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 50px #000;
        }
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .node {
            position: absolute; width: 8px; height: 8px; background: var(--alert-red);
            border-radius: 50%; box-shadow: 0 0 15px var(--alert-red);
            animation: nodeBlink 1.5s infinite; z-index: 10;
        }
        @keyframes nodeBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

        #target-ring {
            position: absolute; top: 41%; left: 63.5%; width: 60px; height: 60px;
            border: 3px solid var(--alert-red); border-radius: 50%;
            transform: translate(-50%, -50%); display: none;
            box-shadow: 0 0 30px var(--alert-red); animation: pulse 1s infinite; z-index: 10;
        }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(0.8); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }

        .clock-overlay { position: absolute; top: 20px; right: 20px; font-size: 26px; color: var(--alert-red); background: rgba(0,0,0,0.7); padding: 5px 15px; border: 1px solid var(--alert-red); z-index: 10; }

        /* BOTTOM */
        .bottom-panel { display: flex; height: 220px; border-top: 1px solid var(--neon-green); background: rgba(0,0,0,0.95); }
        .terminal { flex: 2; padding: 15px; overflow-y: auto; font-size: 14px; border-right: 1px solid var(--neon-green); color: var(--neon-green); }
        .controls { flex: 1; padding: 25px; text-align: center; background: rgba(0, 20, 10, 0.5); }
        .btn-attack {
            background: var(--alert-red); color: white; border: none; padding: 15px 40px;
            cursor: pointer; font-weight: bold; font-size: 20px; box-shadow: 0 0 20px var(--alert-red);
        }
        #timer-display { font-size: 45px; margin-top: 15px; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        /* MODAL */
        #attack-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 2px solid var(--alert-red); padding: 40px;
            z-index: 10000; display: none; text-align: center; box-shadow: 0 0 50px var(--alert-red);
        }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>WRAITH OS v3.5</h2>
            <input type="password" id="pass-input" placeholder="SİSTEM KODU..." autocomplete="off">
        </div>
    </div>

    <div id="main-dashboard">
        <header>
            <div style="font-size: 24px; letter-spacing: 8px; color: var(--neon-green);">WRAITH</div>
            <div style="opacity: 0.7;">[SİSTEM] [ŞƏBƏKƏ] [MODULLAR] [GİZLİ KASSA]</div>
            <div class="lang-select">🇦🇿 AZ ▼
                <div class="lang-dropdown"><a href="index.en.html">🇬🇧 EN</a></div>
            </div>
        </header>

        <div class="map-frame">
            <div class="clock-overlay" id="az-clock">00:00:00</div>
            <div id="target-ring"></div>
            <svg id="svg-layer"></svg>
            <div id="nodes-layer"></div>
        </div>

        <div class="bottom-panel">
            <div class="terminal" id="term-out"></div>
            <div class="controls">
                <button class="btn-attack" onclick="showAttackModal()">HÜCUMA BAŞLA</button>
                <div id="timer-display">00:05:00</div>
            </div>
        </div>
    </div>

    <div id="attack-modal">
        <div id="modal-step-1">
            <p>HƏDƏF ÖLKƏ:</p>
            <input type="text" id="target-name" style="background:transparent; border:1px solid var(--neon-green); color:white; padding:10px; margin:15px; width:100%;"><br>
            <button onclick="nextStep()" style="background:var(--neon-green); padding:10px 20px; border:none; cursor:pointer;">İRƏLİ</button>
        </div>
        <div id="modal-step-2" style="display:none;">
            <p>ONAY KODU:</p>
            <input type="text" id="auth-code" style="background:transparent; border:1px solid var(--alert-red); color:white; padding:10px; margin:15px; width:100%;"><br>
            <button onclick="startFinalAttack()" style="background:var(--alert-red); padding:10px 20px; border:none; color:white; cursor:pointer;">HÜCUMU TƏSDİQLƏ</button>
        </div>
    </div>

    <script>
        const authOverlay = document.getElementById('auth-overlay');
        const dashboard = document.getElementById('main-dashboard');
        const passInput = document.getElementById('pass-input');

        if(localStorage.getItem('wraith_unlocked') === 'true') {
            authOverlay.style.display = 'none';
            dashboard.style.display = 'flex';
            initApp();
        }

        passInput.addEventListener('keyup', (e) => {
            if(passInput.value.toLowerCase() === 'wraith') {
                localStorage.setItem('wraith_unlocked', 'true');
                authOverlay.style.display = 'none';
                dashboard.style.display = 'flex';
                initApp();
            }
        });

        function initApp() {
            setInterval(() => { document.getElementById('az-clock').innerText = new Date().toLocaleTimeString('az-AZ'); }, 1000);
            generateNodes();
            addLog("[SİSTEM] Wraith OS v3.5 uğurla başladıldı.");
            addLog("[ŞƏBƏKƏ] Qlobal xəritə və bağlantı nöqtələri yükləndi.");
        }

        const nodes = [];
        function generateNodes() {
            const container = document.getElementById('nodes-layer');
            for(let i=0; i<25; i++) {
                const x = Math.random() * 90 + 5;
                const y = Math.random() * 70 + 10;
                const node = document.createElement('div');
                node.className = 'node';
                node.style.left = x + '%'; node.style.top = y + '%';
                container.appendChild(node);
                nodes.push({x, y});
            }
        }

        function showAttackModal() { document.getElementById('attack-modal').style.display = 'block'; }
        function nextStep() { document.getElementById('modal-step-1').style.display = 'none'; document.getElementById('modal-step-2').style.display = 'block'; }

        function startFinalAttack() {
            if(document.getElementById('auth-code').value === '2268') {
                document.getElementById('attack-modal').style.display = 'none';
                document.getElementById('target-ring').style.display = 'block';
                startCountdown();
                drawAttackLines();
                addLog("[KRİTİK] Hədəf koordinatları kilidləndi. Hücum başladıldı...");
            } else { alert("YALNIŞ KOD!"); }
        }

        function drawAttackLines() {
            const svg = document.getElementById('svg-layer');
            const targetX = 63.5; const targetY = 41;
            nodes.forEach((node, index) => {
                setTimeout(() => {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", node.x + "%"); line.setAttribute("y1", node.y + "%");
                    line.setAttribute("x2", node.x + "%"); line.setAttribute("y2", node.y + "%");
                    line.setAttribute("stroke", "#ff0033"); line.setAttribute("stroke-width", "2");
                    line.setAttribute("opacity", "0.8");
                    svg.appendChild(line);
                    
                    setTimeout(() => {
                        line.setAttribute("x2", targetX + "%"); line.setAttribute("y2", targetY + "%");
                        line.style.transition = "all 2s ease-in-out";
                    }, 100);
                }, index * 150);
            });
        }

        function startCountdown() {
            let time = 300;
            const timer = setInterval(() => {
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let s = (time % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `00:${m}:${s}`;
                if(time <= 0) clearInterval(timer);
                time--;
            }, 1000);
        }

        function addLog(msg) {
            const out = document.getElementById('term-out');
            out.innerHTML += `<p style='margin-bottom:5px;'>> ${msg}</p>`;
            out.scrollTop = out.scrollHeight;
        }
    </script>
</body>
</html>
