<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRAITH | SYSTEM_HACK_v3.0</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --neon-green: #00ff66;
            --alert-red: #ff0033;
            --bg-obsidian: #020503;
            --glass: rgba(0, 255, 102, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }

        body {
            background-color: #000;
            color: var(--neon-green);
            overflow: hidden;
            height: 100vh;
        }

        /* ----- PROFESSIONAL POPUP ----- */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }

        .auth-card {
            background: var(--bg-obsidian); border: 1px solid var(--neon-green);
            padding: 40px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
            border-radius: 5px; animation: popupFade 0.5s ease;
        }

        @keyframes popupFade { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .auth-card h2 { letter-spacing: 10px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-green); }

        #pass-input {
            background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px; font-size: 20px;
            text-align: center; outline: none; width: 250px;
        }

        /* ----- MAIN UI ----- */
        #main-dashboard { display: none; height: 100vh; flex-direction: column; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 30px; border-bottom: 1px solid var(--neon-green);
            background: rgba(0,0,0,0.8);
        }

        .lang-select { position: relative; cursor: pointer; border: 1px solid var(--neon-green); padding: 5px 10px; }
        .lang-dropdown { display: none; position: absolute; top: 100%; right: 0; background: #000; border: 1px solid var(--neon-green); width: 100px; }
        .lang-select:hover .lang-dropdown { display: block; }
        .lang-dropdown a { display: block; padding: 10px; color: var(--neon-green); text-decoration: none; }
        .lang-dropdown a:hover { background: var(--glass); }

        /* MAP SECTION */
        .map-frame {
            position: relative; flex-grow: 1; background: url('map-en.png') center/cover no-repeat;
            margin: 15px; border: 1px solid rgba(0, 255, 102, 0.2);
        }

        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .node {
            position: absolute; width: 6px; height: 6px; background: var(--alert-red);
            border-radius: 50%; box-shadow: 0 0 10px var(--alert-red);
            animation: nodeBlink 2s infinite;
        }

        @keyframes nodeBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.5); } }

        #target-ring {
            position: absolute; top: 41%; left: 63.5%; 
            width: 50px; height: 50px; border: 2px solid var(--alert-red);
            border-radius: 50%; transform: translate(-50%, -50%);
            display: none; box-shadow: 0 0 20px var(--alert-red);
            animation: pulseRing 1s infinite;
        }

        @keyframes pulseRing { from { transform: translate(-50%, -50%) scale(0.8); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        .clock-overlay { position: absolute; top: 20px; right: 20px; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 15px; border: 1px solid var(--alert-red); color: var(--alert-red); }

        /* TERMINAL */
        .bottom-panel { display: flex; height: 200px; border-top: 1px solid var(--neon-green); background: rgba(0,0,0,0.9); }
        .terminal { flex: 2; padding: 10px; overflow-y: auto; font-size: 13px; border-right: 1px solid var(--neon-green); }
        .controls { flex: 1; padding: 20px; text-align: center; }

        .btn-attack {
            background: var(--alert-red); color: white; border: none;
            padding: 15px 30px; cursor: pointer; font-weight: bold; font-size: 18px;
            box-shadow: 0 0 15px var(--alert-red);
        }

        #attack-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 2px solid var(--alert-red); padding: 30px;
            z-index: 10000; display: none; text-align: center;
        }

        #timer-display { font-size: 40px; margin-top: 10px; color: var(--alert-red); text-shadow: 0 0 10px var(--alert-red); }
    </style>
</head>
<body>

    <!-- Professional Auth Popup -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>WRAITH OS</h2>
            <input type="password" id="pass-input" placeholder="SYSTEM CODE..." autocomplete="off">
            <p style="margin-top: 15px; font-size: 10px; opacity: 0.5;">AUTHENTICATION REQUIRED</p>
        </div>
    </div>

    <div id="main-dashboard">
        <header>
            <div style="font-size: 24px; letter-spacing: 5px;">WRAITH</div>
            <div>[SYSTEM] [NETWORK] [MODULES] [THE VAULT]</div>
            <div class="lang-select">
                🇬🇧 EN ▼
                <div class="lang-dropdown">
                    <a href="index.html">🇦🇿 AZ</a>
                </div>
            </div>
        </header>

        <div class="map-frame" id="map-container">
            <div class="clock-overlay" id="en-clock">00:00:00</div>
            <div id="target-ring"></div>
            <svg id="svg-layer"></svg>
            <div id="nodes-layer"></div>
        </div>

        <div class="bottom-panel">
            <div class="terminal" id="term-out"></div>
            <div class="controls">
                <button class="btn-attack" onclick="showAttackModal()">INITIATE ATTACK</button>
                <div id="timer-display">00:00:00</div>
            </div>
        </div>
    </div>

    <!-- Attack Modal -->
    <div id="attack-modal">
        <div id="modal-step-1">
            <p>TARGET COUNTRY:</p>
            <input type="text" id="target-name" style="background:transparent; border:1px solid var(--neon-green); color:white; padding:5px; margin:10px;"><br>
            <button onclick="nextStep()" style="background:var(--neon-green); padding:5px 15px; border:none; cursor:pointer;">NEXT</button>
        </div>
        <div id="modal-step-2" style="display:none;">
            <p>VERIFICATION CODE:</p>
            <input type="text" id="auth-code" style="background:transparent; border:1px solid var(--alert-red); color:white; padding:5px; margin:10px;"><br>
            <button onclick="startFinalAttack()" style="background:var(--alert-red); padding:5px 15px; border:none; color:white; cursor:pointer;">CONFIRM ATTACK</button>
        </div>
    </div>

    <script>
        const authOverlay = document.getElementById('auth-overlay');
        const dashboard = document.getElementById('main-dashboard');
        const passInput = document.getElementById('pass-input');

        // Check if already logged in
        if(localStorage.getItem('wraith_unlocked') === 'true') {
            authOverlay.style.display = 'none';
            dashboard.style.display = 'flex';
            initApp();
        }

        passInput.addEventListener('keyup', (e) => {
            if(passInput.value.toLowerCase() === 'wraith') {
                localStorage.setItem('wraith_unlocked', 'true');
                authOverlay.style.opacity = '0';
                setTimeout(() => {
                    authOverlay.style.display = 'none';
                    dashboard.style.display = 'flex';
                    initApp();
                }, 500);
            }
        });

        function initApp() {
            startClock();
            generateNodes();
            addLog("[SYSTEM] Wraith OS initialized...");
            addLog("[NETWORK] Secure connection established: IP 192.168.x.x");
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('en-clock').innerText = now.toLocaleTimeString('en-US');
            }, 1000);
        }

        const nodes = [];
        function generateNodes() {
            const container = document.getElementById('nodes-layer');
            for(let i=0; i<20; i++) {
                const x = Math.random() * 90 + 5;
                const y = Math.random() * 80 + 10;
                const node = document.createElement('div');
                node.className = 'node';
                node.style.left = x + '%';
                node.style.top = y + '%';
                container.appendChild(node);
                nodes.push({x, y});
            }
        }

        function showAttackModal() { document.getElementById('attack-modal').style.display = 'block'; }
        function nextStep() { document.getElementById('modal-step-1').style.display = 'none'; document.getElementById('modal-step-2').style.display = 'block'; }

        function startFinalAttack() {
            const code = document.getElementById('auth-code').value;
            if(code === '2268') {
                document.getElementById('attack-modal').style.display = 'none';
                document.getElementById('target-ring').style.display = 'block';
                addLog("[CRITICAL] Attack initiated. Target coordinates locked.");
                startCountdown();
                drawAttackLines();
            } else {
                alert("INVALID CODE!");
            }
        }

        function drawAttackLines() {
            const svg = document.getElementById('svg-layer');
            const targetX = 63.5;
            const targetY = 41;
            
            nodes.forEach((node, index) => {
                setTimeout(() => {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", node.x + "%");
                    line.setAttribute("y1", node.y + "%");
                    line.setAttribute("x2", node.x + "%");
                    line.setAttribute("y2", node.y + "%");
                    line.setAttribute("stroke", "#ff0033");
                    line.setAttribute("stroke-width", "1");
                    line.setAttribute("opacity", "0.6");
                    svg.appendChild(line);
                    
                    setTimeout(() => {
                        line.setAttribute("x2", targetX + "%");
                        line.setAttribute("y2", targetY + "%");
                        line.style.transition = "all 1.5s ease-out";
                    }, 50);
                }, index * 200);
            });
        }

        function startCountdown() {
            let time = 300;
            const display = document.getElementById('timer-display');
            const timer = setInterval(() => {
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let s = (time % 60).toString().padStart(2, '0');
                display.innerText = `00:${m}:${s}`;
                if(time <= 0) clearInterval(timer);
                time--;
            }, 1000);
        }

        function addLog(msg) {
            const out = document.getElementById('term-out');
            out.innerHTML += `<p>> ${msg}</p>`;
            out.scrollTop = out.scrollHeight;
        }
    </script>
</body>
</html>
